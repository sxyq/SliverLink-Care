spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: silverlink-care-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/silverlink_care?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:silverlink}
    password: ${SPRING_DATASOURCE_PASSWORD:silverlink_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

silverlink:
  qrcode:
    public-base-url: ${SILVERLINK_SCAN_URL_PREFIX:http://sxyq27.online/silverlink/scan/?token=}
  security:
    jwt-secret: demo-jwt-secret-key-2026-silverlink-care-must-be-32-bytes!!
    aes-key-id: demo-key-v1
    aes-key-base64: ${SILVERLINK_AES_KEY_BASE64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=}
    signature-window-seconds: 300
    admin-signature-secret: ${SILVERLINK_ADMIN_SIGNATURE_SECRET:demo-admin-signature-secret}
  sms:
    provider: ${SILVERLINK_SMS_PROVIDER:configured}
    access-key: ${SILVERLINK_SMS_ACCESS_KEY:}
    secret: ${SILVERLINK_SMS_SECRET:}
    sign-name: ${SILVERLINK_SMS_SIGN_NAME:}
    template-code: ${SILVERLINK_SMS_TEMPLATE_CODE:}
    mock-enabled: false
    code-ttl-seconds: 300
    max-attempts: 5
    http-endpoint: ${SILVERLINK_SMS_HTTP_ENDPOINT:}
    http-auth-header: ${SILVERLINK_SMS_HTTP_AUTH_HEADER:Authorization}
    http-auth-token: ${SILVERLINK_SMS_HTTP_AUTH_TOKEN:}
    http-timeout-seconds: ${SILVERLINK_SMS_HTTP_TIMEOUT_SECONDS:10}
  smsrelay:
    receiver-phone: ${SILVERLINK_SMSRELAY_RECEIVER_PHONE:13800001111}
    message-prefix: ${SILVERLINK_SMSRELAY_MESSAGE_PREFIX:SL}
    session-ttl-seconds: ${SILVERLINK_SMSRELAY_SESSION_TTL_SECONDS:300}
    authorization-window-seconds: ${SILVERLINK_SMSRELAY_AUTHORIZATION_WINDOW_SECONDS:1200}
    signature-window-seconds: ${SILVERLINK_SMSRELAY_SIGNATURE_WINDOW_SECONDS:300}
    server-url: ${SILVERLINK_SMSRELAY_SERVER_URL:https://sxyq27.online/silverlink-api}
    default-device-id: ${SILVERLINK_SMSRELAY_DEFAULT_DEVICE_ID:relay-android-01}
    default-device-secret: ${SILVERLINK_SMSRELAY_DEFAULT_DEVICE_SECRET:secret-001}
  wechat:
    openid-salt: ${SILVERLINK_WECHAT_OPENID_SALT:demo-wechat-openid-salt}
    app-id: ${SILVERLINK_WECHAT_APP_ID:}
    app-secret: ${SILVERLINK_WECHAT_APP_SECRET:}
    code2session-url: ${SILVERLINK_WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}

logging:
  level:
    com.silverlink.care: info
